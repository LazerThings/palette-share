{% extends "base.html" %}

{% block title %}Create Palette - Palette Share{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Create New Palette</h1>
</div>

<div class="form-container">
    <form method="POST" action="{{ url_for('new_palette') }}">
        <div class="form-group">
            <label for="name">Palette Name *</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4"></textarea>
        </div>
        <div class="form-group checkbox-group">
            <label>
                <input type="checkbox" name="is_public" checked>
                Make this palette public
            </label>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Create Palette</button>
            <a href="{{ url_for('my_palettes') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
